name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded PR runs are cancelled; pushes to main always run to completion.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - name: Generated files are up to date
        run: |
          make generate
          git diff --exit-code || { echo "::error::run 'make generate' and commit the result"; exit 1; }
      - name: Install manifests render
        run: kubectl kustomize config/default > /dev/null

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test

  # Releases on every merge with a feat:/fix: commit: release-please opens its
  # PR, this job merges it with GITHUB_TOKEN, then runs release-please again to
  # tag vX.Y.Z. The second pass is needed because a merge made with
  # GITHUB_TOKEN doesn't trigger a new workflow run.
  release:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      version: ${{ steps.release.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: open-pr
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Merge the release PR
        if: steps.open-pr.outputs.prs_created == 'true'
        env:
          PR: ${{ fromJSON(steps.open-pr.outputs.pr || '{}').number }}
        run: |
          # Mergeability is computed asynchronously after the PR is created.
          for attempt in 1 2 3 4 5 6; do
            gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash && exit 0
            echo "merge failed (attempt ${attempt}), retrying" >&2
            sleep $((attempt * 5))
          done
          echo "could not merge release PR #${PR}" >&2
          exit 1

      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Released images are tagged X.Y.Z, the short SHA and latest.
  publish:
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=sha,prefix=,format=short
            type=raw,value=latest

      # The Dockerfile cross-compiles, so no QEMU is needed for arm64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ needs.release.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Optional: after a release, run a deploy script in another (GitOps) repo.
  # Skipped unless the repository variable DEPLOY_REPO is set. Configure with:
  #   vars.DEPLOY_REPO     owner/repo to check out
  #   vars.DEPLOY_APP      app name passed to the script (default: tender)
  #   vars.DEPLOY_ENV      environment passed to the script (default: prod)
  #   secrets.DEPLOY_TOKEN token with Contents read/write on DEPLOY_REPO
  # The repo must provide scripts/deploy-image.sh <app> <env> <tag>.
  deploy:
    runs-on: ubuntu-latest
    needs: [release, publish]
    if: vars.DEPLOY_REPO != ''
    concurrency: { group: deploy, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOY_REPO }}
          token: ${{ secrets.DEPLOY_TOKEN }}
          path: deploy
          fetch-depth: 0
      - env:
          APP: ${{ vars.DEPLOY_APP || 'tender' }}
          ENVIRONMENT: ${{ vars.DEPLOY_ENV || 'prod' }}
          VERSION: ${{ needs.release.outputs.version }}
        run: deploy/scripts/deploy-image.sh "$APP" "$ENVIRONMENT" "$VERSION"
