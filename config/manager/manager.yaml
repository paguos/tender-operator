apiVersion: v1
kind: Namespace
metadata:
  name: tender-system
---
# Settings. Set `project` (required) in your overlay.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tender-config
data:
  project: ""
  name-prefix: tender
  # Comma-separated project roles Identities may ask for (spec.projectRoles),
  # e.g. roles/aiplatform.user. Empty allows none.
  allowed-project-roles: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tender
  labels:
    app.kubernetes.io/name: tender
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tender
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tender
    spec:
      serviceAccountName: tender
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: tender
          args:
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=:8080
          env:
            - name: TENDER_PROJECT
              valueFrom:
                configMapKeyRef: { name: tender-config, key: project }
            - name: TENDER_NAME_PREFIX
              valueFrom:
                configMapKeyRef: { name: tender-config, key: name-prefix }
            - name: TENDER_ALLOWED_PROJECT_ROLES
              valueFrom:
                configMapKeyRef: { name: tender-config, key: allowed-project-roles, optional: true }
            # A Google service-account key, provided as Secret
            # `tender-gcp-credentials` (key `credentials.json`). See README.
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/secrets/gcp/credentials.json
          volumeMounts:
            - name: gcp-credentials
              mountPath: /var/run/secrets/gcp
              readOnly: true
          ports:
            - name: probes
              containerPort: 8081
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: probes }
            initialDelaySeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: probes }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      volumes:
        - name: gcp-credentials
          secret:
            secretName: tender-gcp-credentials
---
# Prometheus metrics (plain HTTP). Scrape it with a ServiceMonitor, see README.
apiVersion: v1
kind: Service
metadata:
  name: tender-metrics
  labels:
    app.kubernetes.io/name: tender
spec:
  selector:
    app.kubernetes.io/name: tender
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
