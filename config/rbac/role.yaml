---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tender
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloud.paguos.dev
  resources:
  - buckets
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - cloud.paguos.dev
  resources:
  - buckets/finalizers
  verbs:
  - update
- apiGroups:
  - cloud.paguos.dev
  resources:
  - buckets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
